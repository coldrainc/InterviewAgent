global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'harness-api'
    static_configs:
      - targets: ['host.docker.internal:9464']  # API /metrics
    metrics_path: /metrics

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'kafka-exporter'  # 如启用 kafka-exporter
    static_configs:
      - targets: ['kafka:9308']
