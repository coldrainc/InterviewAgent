[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-harness"
version = "0.1.0"
description = "Workflow Agent Harness：Scenario Registry + Trajectory 采集 + 过程评测 + 回归门禁"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = [
  "openai>=1.30",     # LLM-Judge 需要
  "langgraph>=0.2",   # 可选：用 LangGraph 编排 agent
]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]
viz = [
  "jinja2>=3.1",       # HTML 报告（目前内置 template，无强依赖）
]

[tool.setuptools.packages.find]
include = ["harness*"]
