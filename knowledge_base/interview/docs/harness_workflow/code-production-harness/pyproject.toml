[tool.poetry]
name = "workflow-harness-production"
version = "0.1.0"
description = "Workflow Agent Harness — Production-ready service (FastAPI + MongoDB + LangGraph + OTel)"
authors = ["Chen Yuhan <chenyh182@163.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# Web
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.8"
pydantic-settings = "^2.4"
pyyaml = "^6.0"
jinja2 = "^3.1"
httpx = "^0.27"
# Security
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
# DB
motor = "^3.5"          # Async MongoDB driver
redis = "^5.0"
# Task
celery = "^5.4"
# Agent
langgraph = "^0.2"
langchain = "^0.3"
litellm = "^1.45"       # LLM Gateway：多模型 fallback + 成本统计
# Telemetry
opentelemetry-api = "^1.27"
opentelemetry-sdk = "^1.27"
opentelemetry-instrumentation-fastapi = "^0.48"
opentelemetry-instrumentation-asgi = "^0.48"
opentelemetry-exporter-otlp-proto-grpc = "^1.27"
prometheus-client = "^0.21"
# Observability 中间件
asgi-monitor = "^0.11"
# 生产日志
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.23"
testcontainers-mongodb = "^0.0.18"
pytest-cov = "^5.0"
ruff = "^0.6"
mypy = "^1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
