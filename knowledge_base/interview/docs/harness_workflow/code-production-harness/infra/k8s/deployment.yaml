---
# ===== Analyzer Worker Deployment =====
apiVersion: apps/v1
kind: Deployment
metadata: {name: harness-analyzer, namespace: harness, labels: {app: harness-analyzer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: harness-analyzer}}
  template:
    metadata: {labels: {app: harness-analyzer}}
    spec:
      containers:
        - name: worker
          image: <REPLACE_IMAGE_REGISTRY>/workflow-harness-worker:${GIT_TAG:-latest}
          command:
            - /usr/bin/tini
            - --
            - celery
            - -A
            - app.tasks.analyzer_worker.celery_app
            - worker
            - -Q
            - analyzer_queue
            - -c
            - "2"
            - --without-heartbeat
          envFrom:
            - configMapRef: {name: harness-cfg}
            - secretRef: {name: harness-secrets}
          resources:
            requests: {cpu: "2", memory: "4Gi"}
            limits:   {cpu: "4", memory: "8Gi"}

---
# ===== Ingress（HTTP API 对外）=====
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness-ingress
  namespace: harness
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts: ["<REPLACE_INGRESS_HOST>"]
      secretName: harness-tls
  rules:
    - host: <REPLACE_INGRESS_HOST>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: harness-api-svc, port: {number: 80}}}

---
# ServiceAccount 最小权限
apiVersion: v1
kind: ServiceAccount
metadata: {name: harness-sa, namespace: harness}
